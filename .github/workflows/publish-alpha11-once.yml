name: Publish GameLink v0.8.0-alpha.11 verified Windows prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-alpha11-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download tested Windows NSIS build
        env:
          ARTIFACT_DOWNLOAD_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-a48c-81f4-80dc-675798b6a499/raw?se=2026-11-10T04%3A37%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=1e83a9a7-d7e9-5c91-b0c0-6f69fe9178e7&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-10T02%3A52%3A05Z&ske=2026-11-11T02%3A52%3A05Z&sks=b&skv=2026-02-06&sig=O25I2xQSR1GT2WYL8AnJeLp%2BS1iyRBIzaujqsiTNF4A%3D"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 "$ARTIFACT_DOWNLOAD_URL" -o alpha11.zip
          unzip -q alpha11.zip -d checked
      - name: Verify installer SHA-256 and matching alpha metadata SHA-512
        working-directory: checked
        run: |
          set -euo pipefail
          test -s GameLink-Setup-0.8.0-alpha.11.exe
          test -s GameLink-Setup-0.8.0-alpha.11.exe.blockmap
          test -s alpha.yml
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo '331a716eb4c65bda34e6c2a8ebef04a5d799de7119ceef9ae2552f4919be4030  GameLink-Setup-0.8.0-alpha.11.exe' | sha256sum -c -
          grep -Fxq 'version: 0.8.0-alpha.11' alpha.yml
          grep -Fxq 'path: GameLink-Setup-0.8.0-alpha.11.exe' alpha.yml
          test "$(stat -c%s GameLink-Setup-0.8.0-alpha.11.exe)" = '121674854'
          SHA512=$(openssl dgst -sha512 -binary GameLink-Setup-0.8.0-alpha.11.exe | base64 -w0)
          grep -Fq "$SHA512" alpha.yml
          echo 'Verified setup, blockmap, metadata, SHA-256 and SHA-512'
      - name: Publish Alpha 11 without touching stable release
        working-directory: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.8.0-alpha.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release exists; will not replace assets'; exit 1; fi
          gh release create v0.8.0-alpha.11 \
            GameLink-Setup-0.8.0-alpha.11.exe \
            GameLink-Setup-0.8.0-alpha.11.exe.blockmap \
            alpha.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --prerelease \
            --title 'GameLink 0.8.0-alpha.11 — First-stream black-screen recovery' \
            --notes 'Experimental Windows x64 release: improves first-share video startup by validating the capture track before claiming the live stream, attaching video to active peers before launching the optional visual overlay, and adding bounded stream renegotiation/retry in the same room. Includes earlier improvements to independent Auto/Manual viewer quality, spectator pointer geometry, source thumbnails and video diagnostics. Automated Windows build and unit tests succeeded. Real two-device first-share and black-screen resolution remain unverified; TURN may still be needed on some networks. Stable v0.6.1 remains unchanged.'
