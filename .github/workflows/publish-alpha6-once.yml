name: Publish GameLink v0.8.0-alpha.6 verified Windows prerelease
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-alpha6-once.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download tested Windows NSIS build
        env:
          ARTIFACT_DOWNLOAD_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-fe5c-8210-b285-236797ed87ef/raw?se=2026-11-09T14%3A08%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=6474cc2b-17da-5ef7-948a-987777fec318&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-09T06%3A42%3A45Z&ske=2026-11-10T06%3A42%3A45Z&sks=b&skv=2026-02-06&sig=duQrCEA/lL/9Xv4eT6QqGz/J6OFiRVePXukqWHkbpUw%3D"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1000 "$ARTIFACT_DOWNLOAD_URL" -o alpha6.zip
          unzip -q alpha6.zip -d checked
      - name: Verify EXE, blockmap and Alpha metadata match tested archive
        working-directory: checked
        run: |
          set -euo pipefail
          test -s GameLink-Setup-0.8.0-alpha.6.exe
          test -s GameLink-Setup-0.8.0-alpha.6.exe.blockmap
          test -s alpha.yml
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          grep -Fxq 'version: 0.8.0-alpha.6' alpha.yml
          grep -Fxq 'path: GameLink-Setup-0.8.0-alpha.6.exe' alpha.yml
          SHA512=$(openssl dgst -sha512 -binary GameLink-Setup-0.8.0-alpha.6.exe | base64 -w0)
          grep -Fq "$SHA512" alpha.yml
          echo "Verified installer SHA256 and metadata SHA512; bytes=$(stat -c%s GameLink-Setup-0.8.0-alpha.6.exe)"
      - name: Publish prerelease without touching latest.yml
        working-directory: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.8.0-alpha.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Version already published; will not replace assets'; exit 1; fi
          gh release create v0.8.0-alpha.6 \
            GameLink-Setup-0.8.0-alpha.6.exe \
            GameLink-Setup-0.8.0-alpha.6.exe.blockmap \
            alpha.yml \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --prerelease \
            --title 'GameLink 0.8.0-alpha.6 — Stream preview and playback improvements' \
            --notes 'Experimental Windows x64 update. Improves the local stream preview, adds source thumbnail cards to the sharing picker, updates remote video playback handling and diagnostic retry UI, refines the spectator pointer button, and restores 720p/30, 1080p/30, and 1080p/60 streaming profiles. Automated Windows build and tests succeeded. Black-screen fixes, real frame rate and voice/control performance remain unverified across two independent devices. Install as an Alpha build; stable v0.6.1 remains unchanged.'
