name: Publish verified GameLink Alpha 15 artifacts (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alpha15-staged.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve staged verified artifacts from authorized transfer links
        shell: bash
        env:
          WINDOWS_DOWNLOAD_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d190-81f4-a7a9-f1a47b780717/raw?se=2026-11-11T07%3A38%3A51Z&sp=r&sv=2026-06-06&sr=b&scid=e517e48f-b1c5-509d-99e0-3bbc759578b7&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T05%3A21%3A16Z&ske=2026-11-12T05%3A21%3A16Z&sks=b&skv=2026-06-06&sig=4rPybKdy7jTKLz9U4KbNYbysoQUTzkwilvJYoM6l1cE%3D"
          ANDROID_DOWNLOAD_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-6344-81f4-bdfa-90266ca987be/raw?se=2026-11-11T07%3A38%3A43Z&sp=r&sv=2026-06-06&sr=b&scid=5ffb7666-9cb3-5f94-99e2-8368d163c8df&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T05%3A42%3A48Z&ske=2026-11-12T05%3A42%3A48Z&sks=b&skv=2026-06-06&sig=ulzTh6Jhq3CVQLrcHooJm56AaA5ZcHriqm2J9bk0C8Q%3D"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 240 "$WINDOWS_DOWNLOAD_URL" -o windows.zip
          curl --fail --silent --show-error --location --retry 2 --max-time 120 "$ANDROID_DOWNLOAD_URL" -o android.zip
          echo '913a21671f810f3f74e0341cdd00a419227efb7d141d69aa9d463fb0dd4a304a  windows.zip' | sha256sum -c -
          echo '6a6ec61115c9bf0715aa7637af3d62c798722449de12a37a06f0ccf6ed248043  android.zip' | sha256sum -c -
          mkdir -p assets win android
          unzip -q windows.zip -d win
          unzip -q android.zip -d android
          cp win/GameLink-Setup-0.8.0-alpha.15.exe assets/
          cp win/GameLink-Setup-0.8.0-alpha.15.exe.blockmap assets/
          cp win/alpha.yml assets/
          cp android/app-debug.apk assets/GameLink-Android-Companion-0.1.0-alpha.2-debug.apk
          grep -Fq 'version: 0.8.0-alpha.15' assets/alpha.yml
          digest="$(openssl dgst -sha512 -binary assets/GameLink-Setup-0.8.0-alpha.15.exe | openssl base64 -A)"
          grep -Fq "sha512: $digest" assets/alpha.yml
          echo '1598ab1e0125933a47e57692e1d9ff6986ff0d0ce25ea45747ec7a45222aeea5  assets/GameLink-Setup-0.8.0-alpha.15.exe' | sha256sum -c -
          echo '98d817e352944df10998b819b757dcba366aeb59b413b1f5fc7d0100c3b5e44f  assets/GameLink-Android-Companion-0.1.0-alpha.2-debug.apk' | sha256sum -c -
          cat > assets/NOTES.md <<'NOTES'
          # GameLink v0.8.0-alpha.15 — Windows + Android test

          New original GameLink incoming ringtone and a custom dark-purple Accept / Decline call card. Prevent repeated outgoing calls, redundant notifications, and simultaneous ringing. Accepting a call while already in another room leaves the previous room and joins the caller automatically. The old room's microphone, stream, and control are stopped first. Previously delivered Alpha 14 system-tray and microphone improvements are retained.

          The Windows NSIS installer is GameLink-Setup-0.8.0-alpha.15.exe, with alpha.yml and .blockmap for consent-based alpha updates.

          The Android file GameLink-Android-Companion-0.1.0-alpha.2-debug.apk is a **debug-signed testing companion, not a production-signed upgrade**. It may not install over an existing installation because the debug signing key may differ. Do not uninstall your existing GameLink Android installation merely to update, as this may remove your guest identity, friend list, and settings. A stable-signed upgrade path remains necessary.

          Windows, Android compilation, signaling server and local WebRTC automated tests passed. End-to-end live calls and screen streaming across actual Windows/Android devices have not yet been verified.
          NOTES
      - name: Create draft, upload all assets and publish only after verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.8.0-alpha.15'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title 'GameLink Alpha 15 · Windows + Android test' --notes-file assets/NOTES.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            assets/GameLink-Setup-0.8.0-alpha.15.exe \
            assets/GameLink-Setup-0.8.0-alpha.15.exe.blockmap \
            assets/alpha.yml \
            assets/GameLink-Android-Companion-0.1.0-alpha.2-debug.apk
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/assets.txt
          for name in 'GameLink-Setup-0.8.0-alpha.15.exe' 'GameLink-Setup-0.8.0-alpha.15.exe.blockmap' 'alpha.yml' 'GameLink-Android-Companion-0.1.0-alpha.2-debug.apk'; do
            grep -Fqx "$name" /tmp/assets.txt
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title 'GameLink Alpha 15 · Windows + Android test' --notes-file assets/NOTES.md
          echo 'Alpha 15 release published with all four validated assets'
